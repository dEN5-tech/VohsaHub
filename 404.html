<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VohsaHub Redirect</title>
  <script>
    // GitHub Pages SPA redirect
    (function() {
      // Failsafe: if running inside an iframe (e.g. sandbox preview), NEVER redirect to root application!
      if (window.self !== window.top) {
        document.write('<div style="font-family:sans-serif;padding:24px;color:#94a3b8;background:#0f172a;text-align:center;"><h3>404: Страница не найдена</h3><p>Ссылка внутри песочницы указывает на несуществующий адрес.</p></div>');
        return;
      }
      var path = window.location.pathname;
      var repoPrefix = '/VohsaHub';
      if (path.startsWith(repoPrefix)) {
        var subPath = path.substring(repoPrefix.length);
        if (subPath.startsWith('/')) {
          subPath = subPath.substring(1);
        }
        if (subPath.length > 0) {
          var target = repoPrefix + '/#' + subPath + window.location.search + window.location.hash;
          window.location.replace(target);
          return;
        }
      }
      window.location.replace('/VohsaHub/');
    })();
  </script>
</head>
<body>
  Redirecting to VohsaHub...
</body>
</html>
